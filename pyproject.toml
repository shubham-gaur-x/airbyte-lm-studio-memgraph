[tool.ruff]
# Scoped to the two application packages (see Makefile `lint` target).
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + a curated pycodestyle subset), minus E731.
select = ["E4", "E7", "E9", "F"]
# E731: assigning a lambda to a name. dev_agent/orchestrator.py uses this deliberately
# for compact, lazily-evaluated env accessors; rewriting ~17 of them to defs adds noise
# without value. Intentional project convention.
ignore = ["E731"]

[tool.mypy]
# Baseline config: this codebase was not previously type-checked, so it is intentionally
# lenient (not --strict). Tighten incrementally. Third-party SDK/driver typing friction
# (airbyte-agent-sdk, neo4j AsyncResult) is handled with targeted per-line ignores rather
# than blanket module suppression, so real errors still surface.
python_version = "3.11"
ignore_missing_imports = true
